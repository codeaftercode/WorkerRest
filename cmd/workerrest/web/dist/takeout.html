<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <!-- 禁缩放守卫：必须在页面脚本之前执行（外链，内联会被上面的 CSP 拦掉） -->
  <script src="./nozoom.js"></script>
  <title>外卖提醒</title>
  <link rel="stylesheet" href="./takeout.css" />
</head>
<body>
  <div id="app" data-rounded="1">
    <div id="vignette"></div>
    <div id="preview-badge" class="hidden">预览模式 · 点击任意处关闭</div>
    <!-- 督休专员：与休息窗口同一套结构（立绘锚定左下，见 supervisorStage.ts 与 takeout.css）。
         台词只有一段：本提醒配置的提醒内容——外卖窗口进入命令阶段也不换台词 -->
    <div class="figure hidden" id="figure">
      <div class="trim" id="figure-trim">
        <div class="gaze" id="gaze">
          <!-- 镜像层：勾选“水平翻转”时整层 scaleX(-1)（与休息窗口同结构） -->
          <div class="mirror"><img id="figure-img" alt="" /></div>
        </div>
      </div>
    </div>
    <!-- 有督休专员时 .content 变身“游戏对话画面”的底部全宽对话框（与休息窗口同款）：
         名字标签在左上角凸出，台词大字、状态徽标/时间/按钮排进框内；
         支付红包区脱离文档流浮到立绘可见右缘的右侧（位置由脚本写入）。
         无督休专员时维持原版式：内容列居中。 -->
    <!-- 督休专员题名：竖排金色宋体，钉在立绘头部左侧的空白区（不再进对话条）。
         位置与字号由 takeout.js 的 layoutRoleTitle() 按“零遮挡”实测后写进 inline style，
         必须和 #figure 处在同一定位上下文（#app），不能留在 .content 里。 -->
    <div class="dialog-name hidden" id="dialog-name"></div>
    <div class="content">
      <!-- 状态徽标：提前通知（还差几分钟）与"这是第几次推迟" -->
      <div class="tk-badges" id="tk-badges">
        <span class="tk-badge hidden" id="tk-lead">提前提醒</span>
        <span class="tk-badge warn hidden" id="tk-postponed">已推迟 1 次</span>
      </div>
      <!-- 提醒内容：外卖提醒自己的那一套配置，每次弹窗随机/顺序取 1 条；未配置则整块隐藏。
           挂 .dialog-text：与休息窗口的台词、自定义提醒的提醒内容共用同一套排版
           （字号/字重/居中/自动换行/超长自动缩字号，见 takeout.css） -->
      <div class="tk-msg dialog-text hidden" id="tk-msg"></div>
      <!-- 督休专员的台词气泡：有督休专员时提醒内容改由督休专员"说"出（第一段），这里随之显示。
           挂 .dialog-text：与休息窗口的台词、自定义提醒的提醒内容共用同一套排版
           （字号/字重/居中/自动换行/超长自动缩字号，见 takeout.css） -->
      <div class="supervisor-line dialog-text hidden" id="supervisor-line"></div>
      <!-- 外卖优惠券：始终显示该区域；二维码指向固定领取页（不含任何本机标识），手机扫码打开。
           红包虚线框上方的“外卖提醒”胶囊标签浮在框外（absolute，不占框内布局） -->
      <div class="tk-redpacket hidden" id="redpacket">
        <div class="rp-title">外卖提醒</div>
        <div class="rp-qr-wrap">
          <canvas class="rp-qr hidden" id="rp-qr" width="120" height="120"></canvas>
        </div>
        <div class="rp-info">
          <span class="rp-icon">&#129511;</span>
          <span class="rp-text" id="rp-text">外卖优惠券 · 微信扫码领取</span>
        </div>
        <div class="rp-time">当前时间：<span id="rp-time">--:--:--</span></div>
      </div>
      <div class="tk-actions">
        <button class="tk-btn primary" id="tk-ordered">已点好</button>
        <button class="tk-btn" id="tk-skip">不点了</button>
        <button class="tk-btn postpone" id="tk-postpone">推迟</button>
      </div>
    </div>
  </div>
  <script src="./shim.js"></script>
  <script src="./takeout.js"></script>
</body>
</html>
