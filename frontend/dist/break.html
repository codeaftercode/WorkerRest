<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>休息一下</title>
  <link rel="stylesheet" href="./break.css" />
</head>
<body>
  <div id="app">
    <div id="vignette"></div>
    <div id="preview-badge" class="hidden">预览模式 · 点击任意处关闭</div>
    <div class="stage">
      <!-- 虚拟角色：立绘锚定左下（贴底、不贴边）。
           .trim 负责抵消立绘自带的透明边距（见 renderer/figureTrim.ts），
           注视跟随靠 .gaze 层位移实现 -->
      <div class="figure hidden" id="figure">
        <div class="trim" id="figure-trim">
          <div class="gaze" id="gaze">
            <!-- 镜像层：勾选「水平翻转」时整层 scaleX(-1)。单独一层是为了不干扰
                 img 上的语气动画（凑近 / 脉动）与 .trim 的透明边距补偿 -->
            <div class="mirror"><img id="figure-img" alt="" /></div>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="supervisor-line hidden" id="supervisor-line"></div>
        <div class="messages" id="messages"></div>
        <div class="bar">
          <div class="ring-wrap">
            <svg viewBox="0 0 200 200">
              <circle class="ring-bg" cx="100" cy="100" r="88" />
              <circle class="ring-fg" id="ring" cx="100" cy="100" r="88" />
            </svg>
            <div class="countdown" id="countdown">20</div>
            <div class="unit">秒</div>
          </div>
          <a href="#" id="skip-link" class="skip-link">提前结束（Ctrl+X）</a>
        </div>
      </div>
    </div>
  </div>
  <script src="./shim.js"></script>
  <script src="./break.js"></script>
</body>
</html>
