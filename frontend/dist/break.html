<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>休息一下</title>
  <link rel="stylesheet" href="./break.css" />
  <!-- 早期脚本：首帧渲染前根据 ?sup 决定窗口初始可见性。sup=1（启用督休专员）时
       整窗先透明，等立绘加载完成再淡入，避免「先无立绘、后有立绘」闪烁；sup=0
       或缺失时立即显示（无立绘即正确态）。 -->
  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        if (p.get("sup") !== "1") document.documentElement.style.opacity = "1";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <div id="vignette"></div>
    <div id="preview-badge" class="hidden">预览模式 · 点击任意处关闭</div>
    <div class="stage">
      <!-- 督休专员：立绘锚定左下（贴底、不贴边）。
           .trim 负责抵消立绘自带的透明边距（见 renderer/figureTrim.ts），
           注视跟随靠 .gaze 层位移实现 -->
      <div class="figure hidden" id="figure">
        <div class="trim" id="figure-trim">
          <div class="gaze" id="gaze">
            <!-- 镜像层：勾选「水平翻转」时整层 scaleX(-1)。单独一层是为了不干扰
                 img 上的语气动画（凑近 / 脉动）与 .trim 的透明边距补偿 -->
            <div class="mirror"><img id="figure-img" alt="" /></div>
          </div>
        </div>
      </div>
      <!-- 有督休专员时 .content 由脚本/样式变身「游戏对话画面」的底部全宽对话框：
           名字标签在左上角凸出，台词大字、提醒内容次要；倒计时环（.bar）脱离
           文档流，中心落在「立绘右缘~窗口右缘」「对话框顶~窗口顶」两个中点的
           交点上（位置由脚本写入），「提前结束」在环内跟随环居中下沉。
           无督休专员时维持原版式：提醒内容居中、倒计时环沉底。 -->
      <div class="content" id="content">
        <div class="dialog-name hidden" id="dialog-name"></div>
        <div class="supervisor-line hidden" id="supervisor-line"></div>
        <div class="messages" id="messages"></div>
        <div class="bar" id="bar">
          <div class="ring-wrap">
            <svg viewBox="0 0 200 200">
              <circle class="ring-bg" cx="100" cy="100" r="88" />
              <circle class="ring-fg" id="ring" cx="100" cy="100" r="88" />
            </svg>
            <div class="countdown" id="countdown">20</div>
            <div class="unit">秒</div>
          </div>
          <!-- 「提前结束」放进 bar 内跟随环：环被脚本摆到哪，它就居中挂在环下方 -->
          <a href="#" id="skip-link" class="skip-link hidden">提前结束（Ctrl+X）</a>
        </div>
      </div>
    </div>
  </div>
  <script src="./shim.js"></script>
  <script src="./break.js"></script>
</body>
</html>
