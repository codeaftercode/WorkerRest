<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <!-- 禁缩放守卫：必须在页面脚本之前执行（外链，内联会被上面的 CSP 拦掉） -->
  <script src="./nozoom.js"></script>
  <title>休息一下</title>
  <link rel="stylesheet" href="./break.css" />
  <!-- 早期脚本：首帧渲染前根据 ?sup 决定窗口初始可见性。sup=1（启用督休专员）时
       整窗先透明，等立绘加载完成再淡入，避免「先无立绘、后有立绘」闪烁；sup=0
       或缺失时立即显示（无立绘即正确态）。
       必须是外链：上面 CSP 的 default-src 'self' 会拦掉内联脚本 —— 这段以前就是内联，
       从加上 CSP 起一直被拦、从未执行过（2026-10-25 修复）。说明见 break-early.js。 -->
  <script src="./break-early.js"></script>
</head>
<body>
  <div id="app">
    <div id="vignette"></div>
    <div id="preview-badge" class="hidden">预览模式 · 点击任意处关闭</div>
    <!-- 「提前结束」固定在窗口顶部正中，与 #preview-badge 同一位置。两者互斥显示：
         预览时只显示 badge（点任意处即可关），真实休息时只显示它。
         文案（含快捷键）由 break.js 按「设置 → 快捷键」的 endEarly 动态填充。 -->
    <a href="#" id="skip-link" class="skip-link hidden">提前结束</a>
    <!-- 督休专员题名：竖排金色宋体，钉在立绘头部左侧的空白区（不再进对话条）。
         位置与字号由 break.js 的 layoutRoleTitle() 按「零遮挡」实测后写进 inline style，
         所以它必须和 #figure 处在同一定位上下文（#app），不能留在 .content 里——
         留在框内会被框的 overflow 与 22vh 高度一起约束住。 -->
    <div class="dialog-name hidden" id="dialog-name"></div>
    <div class="stage">
      <!-- 督休专员：立绘锚定左下（贴底、不贴边）。
           .trim 负责抵消立绘自带的透明边距（见 renderer/figureTrim.ts），
           注视跟随靠 .gaze 层位移实现 -->
      <div class="figure hidden" id="figure">
        <div class="trim" id="figure-trim">
          <div class="gaze" id="gaze">
            <!-- 镜像层：勾选「水平翻转」时整层 scaleX(-1)。单独一层是为了不干扰
                 img 上的语气动画（凑近 / 脉动）与 .trim 的透明边距补偿 -->
            <div class="mirror"><img id="figure-img" alt="" /></div>
          </div>
        </div>
      </div>
      <!-- 有督休专员时 .content 由脚本/样式变身「游戏对话画面」的底部全宽对话框：
           名字标签在左上角凸出，台词大字、提醒内容次要；倒计时环（.bar）脱离
           文档流，中心落在「立绘右缘~窗口右缘」「对话框顶~窗口顶」两个中点的
           交点上（位置由脚本写入）。
           无督休专员时倒计时环精确居中于屏幕正中央，提醒名称在环正上方、
           提醒内容落在环下方到窗口底边的区域中央（均以环心为基准）。
           「提前结束」两种版式都不在环附近，固定挂在窗口顶部正中（见上方 #skip-link）。 -->
      <div class="content" id="content">
        <!-- 台词（短休 / 长休 / 二阶段命令）与提醒内容（自定义提醒）共用同一套排版：
             都挂 .dialog-text，字号/字重/居中/自动换行只在 CSS 里定义一次。
             有督休专员时两者互斥显示（内置休息用台词说提醒内容，自定义提醒不挂
             督休专员台词、只放自己的提醒内容）。 -->
        <div class="supervisor-line dialog-text hidden" id="supervisor-line"></div>
        <div class="messages dialog-text" id="messages"></div>
        <div class="bar" id="bar">
          <div class="remind-name hidden" id="remind-name"></div>
          <div class="ring-wrap">
            <div class="ring-aura"></div>
            <svg viewBox="0 0 200 200" aria-hidden="true">
              <defs>
                <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop class="rg0" offset="0%" />
                  <stop class="rg1" offset="52%" />
                  <stop class="rg2" offset="100%" />
                  <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="6s" repeatCount="indefinite" />
                </linearGradient>
                <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#bdf7ff" />
                  <stop offset="34%" stop-color="#46cbff" />
                  <stop offset="72%" stop-color="#1f8bff" />
                  <stop offset="100%" stop-color="#0a4fd0" />
                </linearGradient>
                <radialGradient id="bubbleGrad" cx="0.5" cy="0.5" r="0.5">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="#bff2ff" stop-opacity="0.12" />
                </radialGradient>
                <filter id="ringGlow" x="-80%" y="-80%" width="260%" height="260%">
                  <feGaussianBlur stdDeviation="3.2" result="b" />
                  <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>
                <filter id="liquidGlow" x="-40%" y="-40%" width="180%" height="180%">
                  <feGaussianBlur stdDeviation="2.2" />
                </filter>
                <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="2.0" />
                </filter>
                <clipPath id="liquidClip"><circle cx="100" cy="100" r="78" /></clipPath>
              </defs>
              <!-- 外侧能量溢出：从容器壁向外迸发的光丝 + 扩散脉冲（脚本驱动） -->
              <g class="energy-overflow" id="energy-overflow" filter="url(#softGlow)"></g>
              <!-- 容器外壁：厚实带流光的玻璃罐壁 -->
              <circle class="ring-bg" cx="100" cy="100" r="82" />
              <!-- 外壁外缘旋转装饰环（保留顺转流光） -->
              <circle class="ring-deco" cx="100" cy="100" r="89" />
              <!-- 外界能量汲取：从四面八方射向容器壁、撞击后被吸收进容器（脚本驱动） -->
              <g class="energy-intake" id="energy-intake" filter="url(#softGlow)"></g>
              <!-- 内部液态能量：裁剪到容器内，随蓄能上升、带波动 -->
              <g clip-path="url(#liquidClip)">
                <path class="liquid" id="liquid" fill="url(#liquidGrad)" />
                <path class="liquid-surface" id="liquid-surface" fill="none" />
                <ellipse class="liquid-gloss" id="liquid-gloss" cx="100" cy="100" rx="32" ry="9" opacity="0" />
                <g class="bubbles" id="bubbles"></g>
              </g>
              <!-- 容器内壁玻璃高光（液体与罐壁之间的亮缘，盖在液体之上） -->
              <circle class="ring-inner-rim" cx="100" cy="100" r="78" />
            </svg>
            <canvas class="particles" id="particles"></canvas>
            <div class="count-center">
              <div class="countdown" id="countdown">20</div>
              <div class="count-sub"><span class="progress-pct" id="progress-pct"></span></div>
              <!-- 蓄能铭文：环内、进度百分数下方的两行直排题字，随能量呼吸明灭；
                   颜色走 --liquid-accent 与液体/汲取光丝同源，与四周汇聚的光丝融为一体 -->
              <div class="inscribe-lines" id="inscribe-lines" aria-hidden="true">
                <span class="ins-line">整理思绪</span>
                <span class="ins-line">积蓄能量</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./shim.js"></script>
  <script src="./break.js"></script>
</body>
</html>
